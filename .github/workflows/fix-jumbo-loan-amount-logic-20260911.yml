name: Correct jumbo county loan-amount logic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jumbo-loan-amount-logic-20260911.yml'

permissions:
  contents: write

jobs:
  fix-and-regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct jumbo classification language in generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('gen_geo_pages.py')
          s = p.read_text(encoding='utf-8')

          # The old helper inferred whether a jumbo loan was "needed" from home value alone.
          # That is not the correct classification test: the planned loan amount after the
          # down payment must be compared with the county conforming loan limit.
          s, n = re.subn(
              r'def jumbo_likelihood\(median_str, limit_str\):\n.*?\n\ndef median_short',
              '''def jumbo_likelihood(median_str, limit_str):
    """Home-price context only; jumbo status is determined by the loan amount."""
    med, lim = money_to_float(median_str), money_to_float(limit_str)
    if not med or not lim:
        return "Price context unavailable"
    r = med / lim
    if r >= 2.0:
        return "Typical value far above limit"
    if r >= 1.15:
        return "Typical value above limit"
    if r >= 0.90:
        return "Typical value near the limit"
    if r >= 0.60:
        return "Typical value below limit"
    return "Typical value well below limit"


def median_short''',
              s,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected to replace jumbo_likelihood once; replaced {n}')

          # Conforming loan limits are published by FHFA; remove the misleading HUD attribution.
          s = s.replace('per FHFA/HUD 2026 loan limits', 'per FHFA 2026 conforming loan limits')

          # County-table label: price data are context, not a jumbo eligibility determination.
          old = '<th>Is a jumbo loan usually needed?</th></tr></thead>'
          new = '<th>Home-price context vs. conforming limit</th></tr></thead>'
          if old not in s:
              raise SystemExit('County jumbo table header not found')
          s = s.replace(old, new, 1)

          old = '''    spread = ("Values across the county run from roughly %s in %s to about %s in %s, so whether a purchase "
              "needs jumbo financing varies widely by city &mdash; the table below shows where each one sits "
              "against the %s limit."
              % (median_short(cheapest["median"]), cheapest["city"],
                 median_short(priciest["median"]), priciest["city"], limit))'''
          new = '''    spread = ("Values across the county run from roughly %s in %s to about %s in %s. Home price alone does "
              "not determine whether financing is jumbo: compare the planned one-unit loan amount after the down "
              "payment with the %s county conforming limit. The table below is price context only."
              % (median_short(cheapest["median"]), cheapest["city"],
                 median_short(priciest["median"]), priciest["city"], limit))'''
          if old not in s:
              raise SystemExit('County spread block not found')
          s = s.replace(old, new, 1)

          old = '''    lead = ("The 2026 one-unit conforming limit in %s is %s. Any one-unit loan above that is a jumbo loan. "
            "Below: how that line falls across %d %s cities." % (county, limit, len(cities), short))'''
          new = '''    lead = ("The 2026 one-unit conforming limit in %s is %s. Jumbo status depends on the requested loan "
            "amount after the down payment, not on the home's purchase price by itself. Below: local price context "
            "across %d %s cities." % (county, limit, len(cities), short))'''
          if old not in s:
              raise SystemExit('County lead block not found')
          s = s.replace(old, new, 1)

          old = '''        {"q": "Which %s cities usually require a jumbo loan?" % short,
         "a": "It varies by city. In %s, where typical values run around %s, jumbo financing applies to most "
              "standard purchases. In %s, closer to %s, it comes into play mainly on higher-end homes. The "
              "table on this page marks where each of the %d cities we cover falls against the %s limit."
              % (priciest["city"], median_short(priciest["median"]),
                 cheapest["city"], median_short(cheapest["median"]), len(cities), limit)},'''
          new = '''        {"q": "How do home prices relate to jumbo financing in %s?" % short,
         "a": "Home price is context, but it does not determine jumbo status by itself. A higher-priced home can "
              "still use conforming financing if the requested one-unit loan amount after the down payment is at or "
              "below the %s county limit. Typical values range from about %s in %s to about %s in %s; compare your "
              "planned loan amount with the county limit rather than the purchase price alone."
              % (limit, median_short(cheapest["median"]), cheapest["city"],
                 median_short(priciest["median"]), priciest["city"])},'''
          if old not in s:
              raise SystemExit('County jumbo FAQ block not found')
          s = s.replace(old, new, 1)

          # Tighten the county definition so AI systems do not generalize the conforming limit to VA/FHA loans.
          s = s.replace(
              '"(per FHFA 2026 conforming loan limits) rather than the %s national baseline. Any one-unit "\n                      "loan above %s in %s is a jumbo loan."',
              '"(per FHFA 2026 conforming loan limits) rather than the %s national baseline. A conventional one-unit "\n                      "loan amount above %s in %s is generally considered jumbo financing."',
              1,
          )
          s = s.replace(
              '"the national baseline of %s (per FHFA 2026 conforming loan limits). Any one-unit loan above "\n                      "%s in %s is a jumbo loan."',
              '"the national baseline of %s (per FHFA 2026 conforming loan limits). A conventional one-unit loan "\n                      "amount above %s in %s is generally considered jumbo financing."',
              1,
          )
          s = s.replace(
              '"a": "In %s the 2026 one-unit conforming limit is %s (per FHFA 2026 conforming loan limits). A jumbo loan "\n              "is any one-unit loan amount above %s. %s"',
              '"a": "In %s the 2026 one-unit conforming limit is %s (per FHFA 2026 conforming loan limits). A conventional "\n              "one-unit loan amount above %s is generally considered jumbo financing. %s"',
              1,
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Regenerate geographic pages
        run: python3 gen_geo_pages.py

      - name: Validate corrected jumbo logic
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -F 'jumbo financing applies to most standard purchases' wccm-corporate/loans/jumbo/*-county.html
          ! grep -R -F 'Is a jumbo loan usually needed?' wccm-corporate/loans/jumbo/*-county.html
          grep -R -F -q 'Home-price context vs. conforming limit' wccm-corporate/loans/jumbo/*-county.html
          grep -R -F -q 'loan amount after the down payment' wccm-corporate/loans/jumbo/*-county.html
          grep -R -F -q 'per FHFA 2026 conforming loan limits' wccm-corporate/loans/jumbo/*-county.html
          ! grep -R -F 'per FHFA/HUD 2026 loan limits' wccm-corporate/loans/jumbo wccm-corporate/loans/dscr

      - name: Commit corrected generator and generated pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gen_geo_pages.py wccm-corporate/loans wccm-corporate/sitemap.xml wccm-corporate/jumbo-loans.html wccm-corporate/dscr-loans.html wccm-corporate/_redirects
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Correct jumbo loan amount logic for AI visibility'
            git push origin HEAD:main
          fi
