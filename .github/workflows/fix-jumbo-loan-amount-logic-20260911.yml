name: Correct jumbo county loan-amount logic

"on":
  push:
    branches:
      - main
    paths:
      - 'tools/fix_jumbo_logic_20260911.py'
      - '.github/workflows/fix-jumbo-loan-amount-logic-20260911.yml'

permissions:
  contents: write

jobs:
  fix-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct jumbo logic and regenerate pages
        run: python3 tools/fix_jumbo_logic_20260911.py

      - name: Validate corrected jumbo guidance
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -F 'jumbo financing applies to most standard purchases' wccm-corporate/loans/jumbo/*-county.html; then exit 1; fi
          if grep -R -F 'Is a jumbo loan usually needed?' wccm-corporate/loans/jumbo/*-county.html; then exit 1; fi
          if grep -R -F 'per FHFA/HUD 2026 loan limits' wccm-corporate/loans/jumbo wccm-corporate/loans/dscr; then exit 1; fi
          grep -R -F -q 'Home-price context vs. conforming limit' wccm-corporate/loans/jumbo/*-county.html
          grep -R -F -q 'loan amount after the down payment' wccm-corporate/loans/jumbo/*-county.html
          grep -R -F -q 'per FHFA 2026 conforming loan limits' wccm-corporate/loans/jumbo/*-county.html

      - name: Commit regenerated pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gen_geo_pages.py wccm-corporate/loans wccm-corporate/sitemap.xml wccm-corporate/jumbo-loans.html wccm-corporate/dscr-loans.html wccm-corporate/_redirects
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Correct jumbo loan amount logic for AI visibility'
            git push origin HEAD:main
          fi
