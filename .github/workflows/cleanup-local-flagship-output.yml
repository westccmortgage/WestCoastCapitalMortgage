name: Finalize curated local mortgage pages

on:
  push:
    branches:
      - growth/local-flagship-markets-2026-08-25
    paths:
      - tools/cleanup_local_flagship_output.py
      - .github/workflows/cleanup-local-flagship-output.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            wccm-corporate
            tools
          sparse-checkout-cone-mode: true

      - name: Normalize output
        run: python tools/cleanup_local_flagship_output.py

      - name: Final validation
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('wccm-corporate')
          pages = sorted((root / 'mortgage').glob('*.html'))
          assert len(pages) == 18
          all_text = '\n'.join(p.read_text(encoding='utf-8') for p in pages)
          assert '"@type": "Neighborhood"' not in all_text
          assert '"@type": "Community"' not in all_text
          assert '3106865053' not in (root / 'loans.html').read_text(encoding='utf-8')
          assert 'West Coast Capital Mortgage Inc. Company NMLS #2817729' in (root / 'loans.html').read_text(encoding='utf-8')
          assert 'West Coast Capital Mortgage Inc..' not in (root / 'california-mortgage-locations.html').read_text(encoding='utf-8')
          print('Final validation passed')
          PY

      - name: Commit final output
        run: |
          if git diff --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git config user.name "WCCM Growth Automation"
          git config user.email "actions@users.noreply.github.com"
          git add wccm-corporate/mortgage wccm-corporate/california-mortgage-locations.html wccm-corporate/loans.html
          git commit -m "Finalize curated California local mortgage pages"
          git push
