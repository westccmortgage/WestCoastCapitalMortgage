name: Disable pending Washington and New York pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disable-pending-state-pages-20260907.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Disable pending state pages and validate
        run: python3 scripts/disable_pending_state_pages_20260907.py
      - name: Commit production changes
        run: |
          git config user.name "WCCM Visibility Automation"
          git config user.email "actions@users.noreply.github.com"
          git add wccm-corporate
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Disable pending Washington and New York financing pages"
          git push origin main
