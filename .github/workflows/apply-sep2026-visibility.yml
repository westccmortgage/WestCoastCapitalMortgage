name: Apply September 2026 visibility update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sep2026-visibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair validator and run migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_sep2026_visibility_update.py')
          lines=p.read_text().splitlines()
          fixed=[]
          for line in lines:
              if 'canonical count' in line and 'txt.count' in line:
                  fixed.append('        if txt.count(\'<link rel="canonical"\') != 1: errors.append(f"{f}: canonical count " + str(txt.count(\'<link rel="canonical"\')))')
              else:
                  fixed.append(line)
          p.write_text('\n'.join(fixed)+'\n')
          PY
          set +e
          python3 scripts/apply_sep2026_visibility_update.py > migration_run.log 2>&1
          status=$?
          set -e
          cat migration_run.log
          if [ "$status" -ne 0 ]; then
            cp migration_run.log sep2026_visibility_implementation_report.txt
            git config user.name "WCCM Visibility Automation"
            git config user.email "actions@users.noreply.github.com"
            git add sep2026_visibility_implementation_report.txt
            git commit -m "Record September 2026 visibility migration diagnostic" || true
            git push origin main || true
            exit "$status"
          fi
      - name: Commit production changes
        run: |
          git config user.name "WCCM Visibility Automation"
          git config user.email "actions@users.noreply.github.com"
          git add wccm-corporate suncoast-corporate sep2026_visibility_implementation_report.txt
          if git diff --cached --quiet; then
            echo "No production changes required"
            exit 0
          fi
          git commit -m "Implement September 2026 mortgage SEO AEO updates"
          git push origin main
