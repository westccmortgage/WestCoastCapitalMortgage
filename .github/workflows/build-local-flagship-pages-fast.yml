name: Build curated local mortgage pages fast

on:
  push:
    branches:
      - growth/local-flagship-markets-2026-08-25
    paths:
      - tools/build_local_flagship_pages.py
      - .github/workflows/build-local-flagship-pages-fast.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            wccm-corporate
            tools
          sparse-checkout-cone-mode: true

      - name: Build
        run: python tools/build_local_flagship_pages.py

      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('wccm-corporate')
          pages = sorted((root / 'mortgage').glob('*.html'))
          assert len(pages) == 18, f'expected 18 pages, got {len(pages)}'
          for p in pages:
              text = p.read_text(encoding='utf-8')
              assert '<link rel="canonical"' in text
              assert 'Company NMLS #2817729' in text
              assert 'CA DRE Corporation License #02440065' in text
              assert 'Equal Housing Opportunity' in text
          assert (root / 'california-mortgage-locations.html').exists()
          assert (root / 'sitemap.xml').read_text(encoding='utf-8').count('/mortgage/') >= 18
          assert (root / 'growth-sitemap.xml').read_text(encoding='utf-8').count('/mortgage/') >= 18
          print('Validated', len(pages), 'curated local market pages')
          PY

      - name: Commit output
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "WCCM Growth Automation"
          git config user.email "actions@users.noreply.github.com"
          git add wccm-corporate/mortgage wccm-corporate/california-mortgage-locations.html wccm-corporate/sitemap.xml wccm-corporate/growth-sitemap.xml wccm-corporate/loans.html
          git commit -m "Build curated California local mortgage flagship pages"
          git push
