name: Normalize WCCM Contact AI entity signals

on:
  push:
    paths:
      - '.github/workflows/fix-contact-ai-entity-20260917.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Contact entity metadata and refresh script cache key
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('wccm-corporate/contact.html')
          s = p.read_text(encoding='utf-8')
          old = s

          old_desc = 'Contact West Coast Capital Mortgage Call 310-654-1577 or email us. Licensed mortgage lender in California. NMLS #2817729.'
          new_desc = 'Contact West Coast Capital Mortgage Inc. at (310) 654-1577 for mortgage questions, scenario review, purchase, refinance, jumbo, self-employed, bank-statement, Non-QM and investor financing. Company NMLS #2817729.'
          s = s.replace(old_desc, new_desc)
          s = s.replace('<meta name="geo.region" content="US-CA">\n<meta name="geo.placename" content="California">\n', '')

          old_schema = '''{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "West Coast Capital Mortgage",
  "url": "https://westcoastcapitalmortgage.com",
  "telephone": "+1-310-654-1577",
  "email": "westccmortgage@gmail.com",
  "address": {
    "@type": "PostalAddress",
    "addressRegion": "CA",
    "addressCountry": "US"
  },
  "identifier": { "@type": "PropertyValue", "name": "NMLS", "value": "2817729" }
}'''
          new_schema = '''{
  "@context": "https://schema.org",
  "@type": ["FinancialService", "LocalBusiness"],
  "name": "West Coast Capital Mortgage Inc.",
  "alternateName": "West Coast Capital Mortgage",
  "legalName": "West Coast Capital Mortgage Inc.",
  "url": "https://westcoastcapitalmortgage.com",
  "telephone": "+1-310-654-1577",
  "email": "westccmortgage@gmail.com",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "150 E Olive Ave, Unit 112",
    "addressLocality": "Burbank",
    "addressRegion": "CA",
    "postalCode": "91502",
    "addressCountry": "US"
  },
  "areaServed": [
    { "@type": "State", "name": "California" },
    { "@type": "State", "name": "Florida" }
  ],
  "serviceType": ["Home Purchase Loans", "Mortgage Refinance", "Jumbo Loans", "Bank Statement Loans", "Non-QM Loans", "DSCR Loans", "Investment Property Loans", "Mortgage Second Opinion"],
  "sameAs": [
    "https://www.nmlsconsumeraccess.org/EntityDetails.aspx/COMPANY/2817729",
    "https://g.page/r/CXUFd3B5e-n3EBM"
  ],
  "identifier": { "@type": "PropertyValue", "name": "NMLS", "value": "2817729" }
}'''
          if old_schema not in s:
              raise SystemExit('Expected Contact LocalBusiness schema not found')
          s = s.replace(old_schema, new_schema)

          old_contact = '<p class="contact-lines"><b>Office / Loan Officer Questions:</b> <a href="tel:3106541577">310-654-1577</a><br><b>Anatoliy Direct:</b> <a href="tel:3106865053">310-686-5053</a><br><b>Email:</b> <a href="mailto:westccmortgage@gmail.com">westccmortgage@gmail.com</a></p>\n    <p class="muted">Equal Housing Opportunity &middot; NMLS #2817729</p>'
          new_contact = '<p class="contact-lines"><b>Office / Loan Officer Questions:</b> <a href="tel:3106541577">310-654-1577</a><br><b>Anatoliy Direct:</b> <a href="tel:3106865053">310-686-5053</a><br><b>Email:</b> <a href="mailto:westccmortgage@gmail.com">westccmortgage@gmail.com</a><br><b>Office:</b> 150 E Olive Ave, Unit 112, Burbank, CA 91502</p>\n    <p class="muted">West Coast Capital Mortgage Inc. &middot; Company NMLS #2817729 &middot; Equal Housing Opportunity</p>'
          if old_contact not in s:
              raise SystemExit('Expected Contact details block not found')
          s = s.replace(old_contact, new_contact)

          if s == old:
              raise SystemExit('No Contact entity changes made')
          p.write_text(s, encoding='utf-8')

          # Bust the production script URL after the CA/FL-neutral lead-form fix so
          # browsers/renderers do not retain an older California-only script body.
          changed = [str(p)]
          for hp in Path('wccm-corporate').glob('*.html'):
              text = hp.read_text(encoding='utf-8')
              new = text.replace('script.js?v=20260915-leads2', 'script.js?v=20260917-ca-fl')
              if new != text:
                  hp.write_text(new, encoding='utf-8')
                  if str(hp) not in changed:
                      changed.append(str(hp))

          print('Changed files:')
          print('\n'.join(changed))
          PY
      - name: Validate entity normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          s = Path('wccm-corporate/contact.html').read_text(encoding='utf-8')
          assert 'Licensed mortgage lender in California' not in s
          assert 'geo.region' not in s and 'geo.placename' not in s
          assert 'West Coast Capital Mortgage Inc.' in s
          assert '150 E Olive Ave, Unit 112' in s
          assert '"name": "Florida"' in s
          assert 'Company NMLS #2817729' in s

          blocks = re.findall(r'<script type="application/ld\+json">\s*(.*?)\s*</script>', s, flags=re.S)
          assert blocks, 'No JSON-LD found'
          for block in blocks:
              json.loads(block)

          for hp in Path('wccm-corporate').glob('*.html'):
              text = hp.read_text(encoding='utf-8')
              assert 'script.js?v=20260915-leads2' not in text
          assert 'script.js?v=20260917-ca-fl' in Path('wccm-corporate/index.html').read_text(encoding='utf-8')
          print('Contact entity + script cache validation passed')
          PY
      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wccm-corporate
          git commit -m "Normalize Contact entity signals and refresh lead script cache" || exit 0
          git push origin HEAD:main
