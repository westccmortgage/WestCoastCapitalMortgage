name: Normalize WCCM production source

on:
  push:
    branches: [main]
    paths:
      - 'tools/normalize_primary_domain.py'
      - 'tools/install_wccm_gtm.py'
      - 'wccm-corporate/**'
      - 'gen_city_pages.py'
      - 'gen_geo_pages.py'
      - 'flagship_detail.py'
      - 'flagship_data.json'
      - 'ping_indexnow.py'
      - 'tools/*.py'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-wccm-production-source
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize canonical domain and redirects
        run: python3 tools/normalize_primary_domain.py --source

      - name: Install and verify GTM in WCCM HTML
        run: python3 tools/install_wccm_gtm.py

      - name: Commit normalized production source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_normalized() {
            git add wccm-corporate gen_city_pages.py gen_geo_pages.py flagship_detail.py flagship_data.json ping_indexnow.py tools .github/workflows
            if git diff --cached --quiet; then
              echo "No production-source changes needed."
              return 1
            fi
            git commit -m "Normalize WCCM production source"
          }

          if ! commit_normalized; then
            exit 0
          fi

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main advanced during normalization; refreshing and retrying (${attempt}/3)."
            git fetch origin main
            git reset --hard origin/main
            python3 tools/normalize_primary_domain.py --source
            python3 tools/install_wccm_gtm.py

            if ! commit_normalized; then
              echo "Latest main is already normalized and GTM-persisted."
              exit 0
            fi
          done

          echo "Unable to publish normalized production source after 3 attempts."
          exit 1
