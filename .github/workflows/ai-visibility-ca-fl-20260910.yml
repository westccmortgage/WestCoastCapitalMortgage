name: Advance CA FL AI visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-visibility-ca-fl-20260910.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply AEO and entity improvements
        run: python3 .github/scripts/ai_visibility_ca_fl_20260910.py
      - name: Commit production changes
        run: |
          if git diff --quiet -- wccm-corporate; then
            echo "No production changes needed"
            exit 0
          fi
          git config user.name "Anatoliy Kanevsky"
          git config user.email "westccmortgage@gmail.com"
          git add wccm-corporate
          git commit -m "Strengthen California and Florida AI discovery signals"
          git push origin HEAD:main
