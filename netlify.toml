# West Coast Capital Mortgage — static site
# Deployable site lives in wccm-corporate/.
# Normalize canonical-domain references and install production tracking at build
# time so generated pages cannot re-introduce the retired short domain or lose GTM.
[build]
  command = "python3 tools/normalize_primary_domain.py --deploy && python3 tools/install_wccm_gtm.py"
  publish = "wccm-corporate"
